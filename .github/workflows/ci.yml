# CI: every push and pull request — backend tests, frontend type-check + build, Docker images build,
# and a real Chromium launch inside the API image (amd64 + native arm64).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: pip install --require-hashes -r requirements-dev.lock
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    name: Frontend (types + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: node node_modules/typescript/bin/tsc --noEmit -p .
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: node node_modules/next/dist/bin/next build
        working-directory: frontend

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          push: false
          load: true
          tags: passefiltre-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      # A /api/health check is not enough: really start Chromium the way the scraper does
      # (headless, then headful on the private Xvfb display used for remote CAPTCHA solving,
      # with x11vnc on a Unix socket and no TCP listener).
      - name: Browser smoke test (amd64)
        run: >-
          docker run --rm --shm-size=1g --security-opt no-new-privileges:true
          passefiltre-api:ci python -m app.scraper.browser_check
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Same image, built natively on a GitHub-hosted ARM64 runner (the ServeurCasa architecture), and
  # Chromium really launched inside it: catches arm64-only browser problems before merging.
  docker-arm64:
    name: API image arm64 (browser smoke test)
    runs-on: ubuntu-24.04-arm
    needs: [backend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          platforms: linux/arm64
          push: false
          load: true
          tags: passefiltre-api:ci-arm64
          cache-from: type=gha,scope=api-arm64
          cache-to: type=gha,mode=max,scope=api-arm64
      - name: Browser smoke test (arm64)
        run: |
          test "$(uname -m)" = aarch64
          docker run --rm --shm-size=1g --security-opt no-new-privileges:true \
            passefiltre-api:ci-arm64 python -m app.scraper.browser_check
