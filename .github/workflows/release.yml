# CD: push a tag like v1.2.0 → Docker images published on GitHub Container Registry + GitHub release.
#   git tag v1.0.0 && git push origin v1.0.0
# Anyone can then run PasseFiltre with: docker compose pull && docker compose up
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: nothing by default, each job gets only what it needs.
permissions: {}

jobs:
  images:
    name: Publish Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/passefiltre-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          body: |
            ## Lancer PasseFiltre ${{ github.ref_name }}

            **Avec Docker** (rien d'autre à installer) :
            ```bash
            git clone https://github.com/${{ github.repository }}.git && cd ${{ github.event.repository.name }}
            cp .env.example .env        # facultatif : ports, LLM par défaut…
            docker compose pull && docker compose up
            ```

            **Sans Docker** (Python 3.10+ et Node.js 20+) :
            ```bash
            npm run setup
            npm start
            ```
            Puis ouvrez http://localhost:3000
